version: "2"
linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - misspell
    - revive
  settings:
    depguard:
      rules:
        domain-purity:
          files:
            - "!**_test.go"
            - "**/internal/domain/**.go"
          deny:
            - pkg: "net/http"
              desc: domain must stay transport-free
            - pkg: "database/sql"
              desc: domain must stay storage-free
            - pkg: "gorm.io/gorm"
              desc: domain must stay storage-free
            - pkg: "github.com/modelcontextprotocol"
              desc: domain must stay MCP-free
            - pkg: "google.golang.org/adk"
              desc: domain must stay framework-free
            - pkg: "google.golang.org/genai"
              desc: domain must stay provider-free
            - pkg: "github.com/ml8s/agent-runtime/internal/"
              desc: domain must not import sibling packages
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unused-parameter
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
formatters:
  enable:
    - gofumpt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
