name: Release

# Tag-driven release for ml8s/liki-agent-runtime (same model as liki/liki-web).
# Pushing a vYYYY.MM.DD.N tag runs the full gate, then builds, signs, and
# publishes the release image plus the GitHub Release. The GHCR package is
# flipped to public so liki/liki-deploy pull it with job tokens — no PAT.

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not CalVer vYYYY.MM.DD.N" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a main commit" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "ghcr.io/ml8s/liki-agent-runtime:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::ghcr.io/ml8s/liki-agent-runtime:$RELEASE_VERSION already exists; release tags are immutable" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install Node dependencies
        run: npm ci

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Release gate
        run: make gate

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push release image
        id: image
        run: |
          set -euo pipefail
          mkdir -p build/release
          docker buildx build \
            --file Dockerfile \
            --build-arg VERSION="$RELEASE_VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --tag "ghcr.io/ml8s/liki-agent-runtime:$RELEASE_VERSION" \
            --tag "ghcr.io/ml8s/liki-agent-runtime:latest" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file build/release/buildx-metadata.json \
            --push \
            .
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' build/release/buildx-metadata.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke the pushed image
        run: IMAGE="ghcr.io/ml8s/liki-agent-runtime@${{ steps.image.outputs.digest }}" scripts/smoke-image.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Sign and verify release image
        run: |
          set -euo pipefail
          digest="${{ steps.image.outputs.digest }}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          echo "── signing ghcr.io/ml8s/liki-agent-runtime@$digest ──"
          cosign sign --yes "ghcr.io/ml8s/liki-agent-runtime@$digest"
          cosign verify "ghcr.io/ml8s/liki-agent-runtime@$digest" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Make the GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "/user/packages/container/liki-agent-runtime" -F visibility=public \
            || echo "::warning::could not flip package visibility; set it to public in package settings"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "liki-agent-runtime $GITHUB_REF_NAME" \
            --generate-notes
