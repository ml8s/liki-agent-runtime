name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true
        type: string
      source_commit:
        description: 'Full Git commit SHA that produced the candidate image'
        required: true
        type: string
      digests_json:
        description: 'Contents of build/candidate/candidate-digests.json'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-promote-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref_type == 'tag'
    name: Promote locally built digest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DIGESTS_JSON: ${{ inputs.digests_json }}
      REPOSITORY: ml8s/liki-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Validate release ref and source commit
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::workflow must be dispatched on tag v$VERSION" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::version must use CalVer YYYY.MM.DD.N" >&2
            exit 1
          fi
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a lowercase 40-character Git SHA" >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD^{commit})"
          if [ "$actual" != "$SOURCE_COMMIT" ]; then
            echo "::error::tag v$VERSION is at $actual, expected $SOURCE_COMMIT" >&2
            exit 1
          fi

      - name: Validate digest manifest
        id: manifest
        run: |
          set -euo pipefail
          manifest="$DIGESTS_JSON" python3 - <<'PY'
          import json
          import os
          import re

          raw = os.environ["DIGESTS_JSON"]
          try:
              manifest = json.loads(raw)
          except (json.JSONDecodeError, TypeError) as exc:
              raise SystemExit(f"digests_json is not valid JSON: {exc}")
          if not isinstance(manifest, dict):
              raise SystemExit("digests_json must contain a JSON object")
          if manifest.get("repository") != "ml8s/liki-agents":
              raise SystemExit("digests_json repository must be ml8s/liki-agents")
          if manifest.get("source_commit") != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("digests_json source_commit does not match workflow input")
          images = manifest.get("images")
          if not isinstance(images, dict) or set(images) != {"agents"}:
              raise SystemExit("digests_json images must contain exactly agents")
          digest = images["agents"]
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("digests_json images.agents must be sha256 plus 64 lowercase hex characters")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"digest={digest}\n")
          PY

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact candidate digest
        id: promote
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$DIGEST"
          source="ghcr.io/$REPOSITORY@$digest"
          target="ghcr.io/$REPOSITORY:v$VERSION"
          docker buildx imagetools create -t "$target" "$source"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Sign and verify promoted digest
        env:
          OIDC_AUDIENCE: sigstore
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/$REPOSITORY@$IMAGE_DIGEST"
          oidc_token="$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          cosign sign --yes --identity-token "$oidc_token" "$image"
          cosign verify \
            --certificate-identity-regexp "^https://github\\.com/ml8s/liki-agents/\\.github/workflows/promote-release\\.yml@refs/tags/v${VERSION}$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image"

      - name: Record release evidence
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          printf 'source_commit=%s\nimage_digest=%s\n' "$SOURCE_COMMIT" "$DIGEST" \
            > "release-evidence/liki-agents-v$VERSION.env"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: liki-agents-release-evidence-v${{ inputs.version }}
          path: release-evidence/**
          retention-days: 30
          if-no-files-found: error
