x-mcp-fixture: &mcp-fixture
  image: agent-runtime-example/mcp-fixture:local
  build:
    context: ..
    dockerfile: dev/mcp-fixture.Dockerfile
  restart: "no"
  init: true
  deploy:
    resources:
      limits:
        memory: 128M
        cpus: "0.5"

services:
  mcp-tools-a:
    <<: *mcp-fixture
    profiles: ["mcp"]
    expose: ["8085"]
    environment:
      LISTEN_ADDR: :8085
      MCP_FIXTURE_SERVER_NAME: tools-a
      MCP_FIXTURE_PREFIX: tool_a
      MCP_FIXTURE_COUNT: "4"

  mcp-tools-b:
    <<: *mcp-fixture
    profiles: ["mcp"]
    expose: ["8086"]
    environment:
      LISTEN_ADDR: :8086
      MCP_FIXTURE_SERVER_NAME: tools-b
      MCP_FIXTURE_PREFIX: tool_b
      MCP_FIXTURE_COUNT: "3"
    depends_on:
      mcp-tools-a:
        condition: service_started

  agent-runtime:
    image: agent-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${AGENT_RUNTIME_VERSION:-local}
        COMMIT: ${AGENT_RUNTIME_COMMIT:-unknown}
        BUILD_TIME: ${AGENT_RUNTIME_BUILD_TIME:-unknown}
    environment:
      AGENT_RUNTIME_ENV: development
      AGENT_RUNTIME_TOPOLOGY: ${AGENT_RUNTIME_TOPOLOGY:-single}
      AGENT_RUNTIME_PROTOCOL_TOKEN: ${AGENT_RUNTIME_PROTOCOL_TOKEN:-dev-agent-token}
      # The Compose profile is the trusted-header relay topology. The mutual
      # TLS listener (address + certificate trio + identity mapping) is wired
      # by the deployment system, not by this development workload.
      AGENT_RUNTIME_IDENTITY_SOURCE: ${AGENT_RUNTIME_IDENTITY_SOURCE:-trusted_header}
      AGENT_RUNTIME_OIDC_ISSUER: ${AGENT_RUNTIME_OIDC_ISSUER:-}
      AGENT_RUNTIME_OIDC_AUDIENCE: ${AGENT_RUNTIME_OIDC_AUDIENCE:-}
      AGENT_RUNTIME_OIDC_USERNAME_CLAIM: ${AGENT_RUNTIME_OIDC_USERNAME_CLAIM:-sub}
      AGENT_RUNTIME_OIDC_TENANT_CLAIM: ${AGENT_RUNTIME_OIDC_TENANT_CLAIM:-}
      AGENT_RUNTIME_PUBLIC_URL: ${AGENT_RUNTIME_PUBLIC_URL:-http://127.0.0.1:8083}
      AGENT_RUNTIME_MCP_TOOLS_A_URL: http://mcp-tools-a:8085/mcp
      AGENT_RUNTIME_MCP_TOOLS_B_URL: http://mcp-tools-b:8086/mcp
      AGENT_RUNTIME_MCP_TOOLS_A_TOKEN: ${AGENT_RUNTIME_MCP_TOOLS_A_TOKEN:-}
      AGENT_RUNTIME_MCP_TOOLS_B_TOKEN: ${AGENT_RUNTIME_MCP_TOOLS_B_TOKEN:-}
      AGENT_RUNTIME_MCP_TIMEOUT_SECONDS: ${AGENT_RUNTIME_MCP_TIMEOUT_SECONDS:-30}
      AGENT_RUNTIME_MAX_CONCURRENT_RUNS: ${AGENT_RUNTIME_MAX_CONCURRENT_RUNS:-32}
      AGENT_RUNTIME_DEPLOYMENT_FILE: /agent-deployment/deployment.json
      AGENT_RUNTIME_LLM_BASE_URL: ${AGENT_RUNTIME_LLM_BASE_URL:?AGENT_RUNTIME_LLM_BASE_URL is required}
      AGENT_RUNTIME_LLM_API_KEY: ${AGENT_RUNTIME_LLM_API_KEY}
      AGENT_RUNTIME_LLM_MODEL: ${AGENT_RUNTIME_LLM_MODEL:?AGENT_RUNTIME_LLM_MODEL is required}
      AGENT_RUNTIME_LLM_TEMPERATURE: ${AGENT_RUNTIME_LLM_TEMPERATURE:-0.2}
      AGENT_RUNTIME_LLM_PROVIDER: ${AGENT_RUNTIME_LLM_PROVIDER:?AGENT_RUNTIME_LLM_PROVIDER is required}
      AGENT_RUNTIME_LLM_STRUCTURED_OUTPUT: ${AGENT_RUNTIME_LLM_STRUCTURED_OUTPUT:-}
      AGENT_RUNTIME_LLM_MAX_OUTPUT_TOKENS: ${AGENT_RUNTIME_LLM_MAX_OUTPUT_TOKENS:-}
    ports:
      - "8083:8083"
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dev/agent-deployment:/agent-deployment:ro
      - ./dev/agent-deployment/skills:/skills:ro
      - agent-audit-data:/data
    restart: "no"
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/agent-runtime", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

volumes:
  agent-audit-data:
