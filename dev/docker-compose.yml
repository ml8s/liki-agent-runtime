services:
  engine-mcp:
    image: liki-engine:local
    entrypoint: ["/usr/local/bin/engine-mcp", "--addr", ":8085"]
    profiles: ["mcp"]
    expose: ["8085"]
    environment:
      LISTEN_ADDR: :8085
    restart: "no"
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

  counsel-mcp:
    image: liki-counsel:local
    profiles: ["mcp"]
    expose: ["8086"]
    environment:
      LIKI_MCP_URL: http://engine-mcp:8085/mcp
      LIKI_MCP_TIMEOUT: ${LIKI_MCP_TIMEOUT_SECONDS:-30}
    restart: "no"
    init: true
    depends_on:
      engine-mcp:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  liki-agent-runtime:
    image: liki-agent-runtime:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${LIKI_AGENT_RUNTIME_VERSION:-local}
        COMMIT: ${LIKI_AGENT_RUNTIME_COMMIT:-unknown}
        BUILD_TIME: ${LIKI_AGENT_RUNTIME_BUILD_TIME:-unknown}
    environment:
      LIKI_ENV: development
      LIKI_AGENT_RUNTIME_TOPOLOGY: ${LIKI_AGENT_RUNTIME_TOPOLOGY:-single}
      LIKI_AGENT_RUNTIME_INTERNAL_TOKEN: ${LIKI_AGENT_RUNTIME_INTERNAL_TOKEN:-dev-agent-token}
      LIKI_AGENT_RUNTIME_PUBLIC_URL: ${LIKI_AGENT_RUNTIME_PUBLIC_URL:-http://127.0.0.1:8083}
      LIKI_AGENT_RUNTIME_DB_PATH: /data/liki-agent-runtime-audit.db
      LIKI_MCP_ENGINE_URL: http://engine-mcp:8085/mcp
      LIKI_MCP_COUNSEL_URL: http://counsel-mcp:8086/mcp/bazi
      LIKI_MCP_ENGINE_TOKEN: ${LIKI_MCP_ENGINE_TOKEN:-}
      LIKI_MCP_COUNSEL_TOKEN: ${LIKI_MCP_COUNSEL_TOKEN:-}
      LIKI_MCP_TIMEOUT_SECONDS: ${LIKI_MCP_TIMEOUT_SECONDS:-30}
      LIKI_MAX_CONCURRENT_RUNS: ${LIKI_MAX_CONCURRENT_RUNS:-32}
      LIKI_AGENT_RUNTIME_DEPLOYMENT_FILE: /agent-deployment/deployment.json
      LIKI_AGENT_RUNTIME_SKILLS_ROOT: /agent-deployment/skills
      LIKI_LLM_BASE_URL: ${LIKI_LLM_BASE_URL:?LIKI_LLM_BASE_URL is required}
      LIKI_LLM_API_KEY: ${LIKI_LLM_API_KEY}
      LIKI_LLM_MODEL: ${LIKI_LLM_MODEL:?LIKI_LLM_MODEL is required}
      LIKI_LLM_TEMPERATURE: ${LIKI_LLM_TEMPERATURE:-0.2}
      LIKI_LLM_PROVIDER: ${LIKI_LLM_PROVIDER:?LIKI_LLM_PROVIDER is required}
      LIKI_LLM_STRUCTURED_OUTPUT: ${LIKI_LLM_STRUCTURED_OUTPUT:-}
      LIKI_LLM_MAX_OUTPUT_TOKENS: ${LIKI_LLM_MAX_OUTPUT_TOKENS:-}
    ports:
      - "8083:8083"
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dev/agent-deployment:/agent-deployment:ro
      - agent-audit-data:/data
    restart: "no"
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/liki-agent-runtime", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

volumes:
  agent-audit-data:
