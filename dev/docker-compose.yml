x-mcp-fixture: &mcp-fixture
  image: agentgo-example/mcp-fixture:local
  build:
    context: ..
    dockerfile: dev/mcp-fixture.Dockerfile
  restart: "no"
  init: true
  deploy:
    resources:
      limits:
        memory: 128M
        cpus: "0.5"

services:
  mcp-tools-a:
    <<: *mcp-fixture
    profiles: ["mcp"]
    expose: ["8085"]
    environment:
      LISTEN_ADDR: :8085
      MCP_FIXTURE_SERVER_NAME: tools-a
      MCP_FIXTURE_PREFIX: tool_a
      MCP_FIXTURE_COUNT: "4"

  mcp-tools-b:
    <<: *mcp-fixture
    profiles: ["mcp"]
    expose: ["8086"]
    environment:
      LISTEN_ADDR: :8086
      MCP_FIXTURE_SERVER_NAME: tools-b
      MCP_FIXTURE_PREFIX: tool_b
      MCP_FIXTURE_COUNT: "3"
    depends_on:
      mcp-tools-a:
        condition: service_started

  agentgo:
    image: agentgo:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${AGENTGO_VERSION:-local}
        COMMIT: ${AGENTGO_COMMIT:-unknown}
        BUILD_TIME: ${AGENTGO_BUILD_TIME:-unknown}
    environment:
      AGENTGO_ENV: development
      AGENTGO_TOPOLOGY: ${AGENTGO_TOPOLOGY:-single}
      AGENTGO_PROTOCOL_TOKEN: ${AGENTGO_PROTOCOL_TOKEN:-dev-agent-token}
      # The Compose profile is the trusted-header relay topology. The mutual
      # TLS listener (address + certificate trio + identity mapping) is wired
      # by the deployment system, not by this development workload.
      AGENTGO_IDENTITY_SOURCE: ${AGENTGO_IDENTITY_SOURCE:-trusted_header}
      AGENTGO_OIDC_ISSUER: ${AGENTGO_OIDC_ISSUER:-}
      AGENTGO_OIDC_AUDIENCE: ${AGENTGO_OIDC_AUDIENCE:-}
      AGENTGO_OIDC_USERNAME_CLAIM: ${AGENTGO_OIDC_USERNAME_CLAIM:-sub}
      AGENTGO_OIDC_TENANT_CLAIM: ${AGENTGO_OIDC_TENANT_CLAIM:-}
      AGENTGO_PUBLIC_URL: ${AGENTGO_PUBLIC_URL:-http://127.0.0.1:8083}
      AGENTGO_MCP_TOOLS_A_URL: http://mcp-tools-a:8085/mcp
      AGENTGO_MCP_TOOLS_B_URL: http://mcp-tools-b:8086/mcp
      AGENTGO_MCP_TOOLS_A_TOKEN: ${AGENTGO_MCP_TOOLS_A_TOKEN:-}
      AGENTGO_MCP_TOOLS_B_TOKEN: ${AGENTGO_MCP_TOOLS_B_TOKEN:-}
      AGENTGO_MCP_TIMEOUT_SECONDS: ${AGENTGO_MCP_TIMEOUT_SECONDS:-30}
      AGENTGO_MAX_CONCURRENT_RUNS: ${AGENTGO_MAX_CONCURRENT_RUNS:-32}
      AGENTGO_DEPLOYMENT_FILE: /agent-deployment/deployment.json
      AGENTGO_LLM_BASE_URL: ${AGENTGO_LLM_BASE_URL:?AGENTGO_LLM_BASE_URL is required}
      AGENTGO_LLM_API_KEY: ${AGENTGO_LLM_API_KEY}
      AGENTGO_LLM_MODEL: ${AGENTGO_LLM_MODEL:?AGENTGO_LLM_MODEL is required}
      AGENTGO_LLM_TEMPERATURE: ${AGENTGO_LLM_TEMPERATURE:-0.2}
      AGENTGO_LLM_PROVIDER: ${AGENTGO_LLM_PROVIDER:?AGENTGO_LLM_PROVIDER is required}
      AGENTGO_LLM_STRUCTURED_OUTPUT: ${AGENTGO_LLM_STRUCTURED_OUTPUT:-}
      AGENTGO_LLM_MAX_OUTPUT_TOKENS: ${AGENTGO_LLM_MAX_OUTPUT_TOKENS:-}
    ports:
      - "8083:8083"
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dev/agent-deployment:/agent-deployment:ro
      - ./dev/agent-deployment/skills:/skills:ro
      - agent-audit-data:/data
    restart: "no"
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/agentgo", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

volumes:
  agent-audit-data:
