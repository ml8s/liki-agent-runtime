<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-runtime dev chat</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 860px; padding: 1rem; }
    h1 { font-size: 1.15rem; margin: 0 0 1rem; }
    form, .status { display: grid; gap: .5rem; }
    .settings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
    input, button { border: 1px solid color-mix(in srgb, currentColor 25%, transparent); border-radius: .4rem; font: inherit; padding: .5rem; }
    button { cursor: pointer; }
    button:disabled { opacity: .6; }
    #conversation { display: grid; gap: .75rem; margin: 1rem 0; }
    .message { border: 1px solid color-mix(in srgb, currentColor 15%, transparent); border-radius: .5rem; padding: .75rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: color-mix(in srgb, royalblue 10%, transparent); }
    .assistant { background: color-mix(in srgb, currentColor 5%, transparent); }
    .status { font-size: .85rem; min-height: 1.2em; opacity: .75; }
    .status.error { color: #c62828; font-weight: 600; opacity: 1; }
  </style>
</head>
<body>
  <h1>agent-runtime development chat</h1>
  <form>
    <div class="settings">
      <input id="token" type="password" placeholder="Internal bearer token (optional in dev)" autocomplete="off">
      <input id="userId" type="text" placeholder="User ID" value="local-chat" autocomplete="off" required>
      <input id="threadId" type="text" placeholder="Thread ID" autocomplete="off" required>
    </div>
    <textarea id="prompt" rows="4" placeholder="Message" required></textarea>
    <div>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
  </form>
  <p id="status" class="status" aria-live="polite"></p>
  <main id="conversation"></main>

  <script type="module">
    import { HttpAgent } from "https://esm.sh/@ag-ui/client@1.0.0";

    const conversation = document.querySelector("#conversation");
    const prompt = document.querySelector("#prompt");
    const send = document.querySelector("#send");
    const stop = document.querySelector("#stop");
    const status = document.querySelector("#status");
    const threadId = document.querySelector("#threadId");
    const userId = document.querySelector("#userId");
    const token = document.querySelector("#token");

    threadId.value = localStorage.getItem("agent-runtime-dev-thread") ?? crypto.randomUUID();
    let history = [];
    let running = false;
    let currentAgent;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function appendMessage(role, content, id = crypto.randomUUID()) {
      const message = { id, role, content };
      history.push(message);
      const element = document.createElement("article");
      element.className = `message ${role}`;
      element.dataset.id = id;
      element.textContent = content;
      conversation.append(element);
      element.scrollIntoView({ block: "end" });
      return message;
    }

    function renderMessage(message) {
      const element = conversation.querySelector(`[data-id="${CSS.escape(message.id)}"]`);
      if (element) element.textContent = message.content;
    }

    function setRunning(value) {
      running = value;
      send.disabled = value;
      stop.disabled = !value;
    }

    function persistThread() {
      localStorage.setItem("agent-runtime-dev-thread", threadId.value);
    }

    async function sendMessage() {
      const content = prompt.value.trim();
      if (!content || running) return;
      persistThread();
      prompt.value = "";
      appendMessage("user", content);
      setRunning(true);
      setStatus("connecting");

      let assistant;
      const agent = new HttpAgent({
        headers: {
          ...(token.value ? { Authorization: `Bearer ${token.value}` } : {}),
          "X-Agent-User-ID": userId.value,
        },
        initialMessages: structuredClone(history),
        threadId: threadId.value,
        url: "/ag-ui",
      });
      currentAgent = agent;

      const toolNames = new Map();
      try {
        const result = await agent.runAgent({ runId: crypto.randomUUID() }, {
          onRunStartedEvent() { setStatus("running"); },
          onTextMessageStartEvent({ event }) {
            assistant = appendMessage("assistant", "", event.messageId);
          },
          onTextMessageContentEvent({ event }) {
            assistant ??= appendMessage("assistant", "", event.messageId);
            assistant.content += event.delta;
            renderMessage(assistant);
          },
          onToolCallStartEvent({ event }) {
            toolNames.set(event.toolCallId, event.toolCallName);
            setStatus(`tool: ${event.toolCallName}`);
          },
          onToolCallEndEvent({ event }) {
            setStatus(`tool complete: ${toolNames.get(event.toolCallId) ?? event.toolCallId}`);
            toolNames.delete(event.toolCallId);
          },
          onSubagentStartedEvent({ event }) { setStatus(`agent: ${event.name}`); },
          onSubagentFinishedEvent() { setStatus("agent complete"); },
          onSubagentErrorEvent({ event }) { setStatus(`agent failed: ${event.message}`, true); },
          onRunFinishedEvent() { setStatus("complete"); },
          onRunErrorEvent({ event }) { setStatus(event.message || "agent run failed", true); },
          onRunFailed({ error }) { setStatus(error.message, true); },
        });

        if (!assistant) {
          const answers = result.newMessages.filter((message) => message.role === "assistant");
          const content = answers.at(-1)?.content;
          if (typeof content === "string" && content.length > 0) {
            appendMessage("assistant", content);
          } else {
            setStatus("agent returned no text", true);
          }
        }
      } catch (error) {
        setStatus(error instanceof Error ? error.message : String(error), true);
      } finally {
        currentAgent = undefined;
        setRunning(false);
      }
    }

    document.querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      void sendMessage();
    });
    stop.addEventListener("click", () => currentAgent?.abortRun());
  </script>
</body>
</html>
